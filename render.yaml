services:
  - type: web
    name: testpilot-ai
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: DEBUG
        value: "false"
      - key: DEMO_BUG_ENABLED
        value: "true"
